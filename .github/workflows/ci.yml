name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest nbconvert ipykernel

      - name: Run automated tests
        run: pytest tests/ -v --tb=short

      - name: Validate notebook is valid JSON
        run: python -c "import json; json.load(open('AB_Test_Analysis.ipynb')); print('Notebook JSON is valid')"

      - name: Execute notebook end-to-end
        run: |
          jupyter nbconvert --to notebook --execute AB_Test_Analysis.ipynb \
            --output AB_Test_Analysis_executed.ipynb \
            --ExecutePreprocessor.timeout=120
          echo "Notebook executed successfully"
